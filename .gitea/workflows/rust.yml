name: Rust

# Dual CI (Forgejo + Gitea) — this file MUST stay byte-identical in
# .forgejo/workflows/rust.yml and .gitea/workflows/rust.yml. The `parity`
# job in build-and-release.yml fails the run when the copies drift.
# GitHub is a read-only archive mirror — no workflows there.
#
# Covers the Rust restart (crates/* + xtask): fmt, clippy, tests and
# release builds for Linux (native) and Windows (mingw cross-build).
# Steam integration tests talk to the real client when present and
# degrade to the unavailable backend otherwise — no secrets needed.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Slint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Slint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  coverage:
    name: Coverage → Codacy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pushes to main/dev und PRs aus diesem Repo (Forks haben keinen Zugriff auf Secrets).
    # Codacy benötigt den Head-Commit + gemeinsamen Vorfahren für PR-Diff-Coverage,
    # deshalb wird Coverage auch bei PRs hochgeladen.
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Slint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate workspace coverage (LCOV)
        run: |
          cargo tarpaulin --workspace --out lcov --output-dir target/codacy --verbose
      - name: Locate LCOV report
        id: locate
        run: |
          REPORT="$(find target/codacy -maxdepth 1 -type f \( -name 'lcov.info' -o -name 'lcov.dat' -o -name '*.lcov' \) | head -n 1)"
          if [ -z "$REPORT" ]; then
            echo "::error::No LCOV coverage report was generated by cargo-tarpaulin"
            exit 1
          fi
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Codacy
        if: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          # Codacy Coverage Reporter (Docs: coverage hinzufügen, alternative Ausführung, erweiterte Szenarien)
          # -l Rust   : das LCOV-Report der Rust-Sprache zuordnen
          # -r <file> : workspace-weites LCOV-Report, das jedes getestete Crate abdeckt
          # Erkennt Commit-SHA-1 und Branch automatisch aus git.
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
            -l Rust \
            -r "${{ steps.locate.outputs.report }}"
      - name: Upload coverage übersprungen (kein Token)
        if: ${{ secrets.CODACY_PROJECT_TOKEN == '' }}
        run: |
          echo "::notice::CODACY_PROJECT_TOKEN ist nicht gesetzt — Coverage wurde lokal erzeugt, aber nicht an Codacy hochgeladen."
          echo "Das Geheimnis CODACY_PROJECT_TOKEN setzen (Codacy → Project settings → API token), um Uploads zu aktivieren."

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Vulnerabilities fail the run; unmaintained warnings only warn.
      # See SECURITY.md (Verification / Secure Build).
      - run: cargo audit

  build-linux:
    name: Build + dist (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Slint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- dist
      - uses: actions/upload-artifact@v7
        with:
          name: gregmodmanager-linux-x64
          path: dist/*.tar.gz*

  build-windows:
    name: Cross-build (Windows x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw + Slint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-gnu -p greg-app -p greg-cli
