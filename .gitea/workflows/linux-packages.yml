name: Rust Linux Packages

# Dual CI (Forgejo + Gitea) — see build-and-release.yml header for instance notes.
# Manual or path-triggered detailed package build (no release, no notify).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'build/scripts/linux/**'
      - '.forgejo/workflows/linux-packages.yml'
      - '.gitea/workflows/linux-packages.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_pre: ${{ steps.resolve.outputs.is_pre }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        shell: bash
        run: |
          # VERSION file is the single source of truth, workspace Cargo.toml is the fallback.
          ver="$(cat VERSION 2>/dev/null | tr -d '\r' | xargs)"
          if [ -z "$ver" ]; then
            ver=$(sed -n 's:^version = "\(.*\)":\1:p' Cargo.toml | head -n 1 | tr -d '\r' | xargs)
          fi
          [ -n "$ver" ] || ver='1.6.1'
          is_pre='false'
          [[ "$ver" == *-* || "$GITHUB_REF_NAME" != "main" ]] && is_pre='true'
          {
            echo "version=$ver"
            echo "is_pre=$is_pre"
          } >> "$GITHUB_OUTPUT"

  build-packages:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Slint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_Linux_x86_64.tar.gz"
          tar -xzf nfpm.tar.gz nfpm
          sudo mv nfpm /usr/local/bin/
          nfpm --version

      - name: Build packages
        run: |
          cargo run -p xtask -- dist
          STAGE="$(ls -d dist/gregmodmanager-*-linux-x64 | head -n 1)"
          chmod +x ./build/scripts/linux/build-rust-packages.sh
          ./build/scripts/linux/build-rust-packages.sh "$STAGE" ${{ needs.version.outputs.version }} ${{ needs.version.outputs.is_pre }} ./artifacts/rust-linux/packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages-detailed
          path: artifacts/rust-linux/packages/gregmodmanager-*
          if-no-files-found: error

      - name: Build container (instance registry)
        if: github.event_name != 'pull_request'
        run: |
          REGISTRY_HOST="$(echo "${{ github.server_url }}" | sed -e 's|^https\?://||' -e 's|/.*$||')"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY_HOST" -u ${{ github.actor }} --password-stdin
          STAGE="$(ls -d dist/gregmodmanager-*-linux-x64 | head -n 1)"
          mkdir -p publish && cp -r "$STAGE/"* publish/
          docker build -t "$REGISTRY_HOST/${{ github.repository_owner }}/gregmodmanager:${{ needs.version.outputs.version }}" -t "$REGISTRY_HOST/${{ github.repository_owner }}/gregmodmanager:latest" -f - . <<'EOF'
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends fontconfig libfreetype6 && rm -rf /var/lib/apt/lists/*
          WORKDIR /opt/gregmodmanager
          COPY publish/ ./
          RUN chmod +x /opt/gregmodmanager/gregmodmanager
          ENTRYPOINT ["/opt/gregmodmanager/gregmodmanager"]
          EOF
          docker push "$REGISTRY_HOST/${{ github.repository_owner }}/gregmodmanager:${{ needs.version.outputs.version }}"
          docker push "$REGISTRY_HOST/${{ github.repository_owner }}/gregmodmanager:latest"
