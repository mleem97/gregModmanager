name: Avalonia Linux Packages

# Forgejo Actions port — see build-and-release.yml header for instance notes.
# Manual or path-triggered detailed package build (no release, no notify).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/GregModmanager.Avalonia/**'
      - 'src/GregModmanager.Core/**'
      - 'build/scripts/linux/**'
      - '.forgejo/workflows/linux-packages.yml'

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: '10.0.x'
  AVALONIA_PROJECT: 'src/GregModmanager.Avalonia/GregModmanager.Avalonia.csproj'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_pre: ${{ steps.resolve.outputs.is_pre }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        shell: bash
        run: |
          ver=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' "$AVALONIA_PROJECT" | head -n 1 | tr -d '\r' | xargs)
          [ -n "$ver" ] || ver='1.5.0'
          is_pre='false'
          [[ "$ver" == *-* || "$GITHUB_REF_NAME" != "main" ]] && is_pre='true'
          {
            echo "version=$ver"
            echo "is_pre=$is_pre"
          } >> "$GITHUB_OUTPUT"

  build-packages:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_Linux_x86_64.tar.gz"
          tar -xzf nfpm.tar.gz nfpm
          sudo mv nfpm /usr/local/bin/
          nfpm --version

      - name: Build packages
        run: |
          chmod +x ./build/scripts/linux/build-avalonia-packages.sh
          ./build/scripts/linux/build-avalonia-packages.sh ./artifacts/avalonia-linux ${{ needs.version.outputs.version }} ${{ needs.version.outputs.is_pre }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages-detailed
          path: artifacts/avalonia-linux/packages/gregModmanager-*
          if-no-files-found: error

      - name: Build container (Forgejo registry)
        if: github.event_name != 'pull_request'
        run: |
          REGISTRY_HOST="$(echo "${{ github.server_url }}" | sed -e 's|^https\?://||' -e 's|/.*$||')"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY_HOST" -u ${{ github.actor }} --password-stdin
          docker build -t "$REGISTRY_HOST/${{ github.repository_owner }}/gregmodmanager:${{ needs.version.outputs.version }}" -t "$REGISTRY_HOST/${{ github.repository_owner }}/gregmodmanager:latest" -f - . <<'EOF'
          FROM mcr.microsoft.com/dotnet/runtime-deps:9.0
          WORKDIR /opt/gregmodmanager
          COPY artifacts/avalonia-linux/publish/ ./
          RUN chmod +x /opt/gregmodmanager/GregModmanager
          ENTRYPOINT ["/opt/gregmodmanager/GregModmanager"]
          EOF
          docker push "$REGISTRY_HOST/${{ github.repository_owner }}/gregmodmanager:${{ needs.version.outputs.version }}"
          docker push "$REGISTRY_HOST/${{ github.repository_owner }}/gregmodmanager:latest"
