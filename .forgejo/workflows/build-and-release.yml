name: Build & Release

# Dual CI: Forgejo Actions (.forgejo/workflows/) + Gitea Actions
# (.gitea/workflows/). Both directories MUST stay byte-identical — the
# `parity` job below fails the run when the copies drift.
# .github/workflows/ does not exist on purpose: GitHub is a read-only
# archive mirror, so no automation runs there.
#
# Rust restart: the C# / Avalonia sources are frozen under
# .reference/modmanager-old/ and no longer build on main — all build jobs
# below compile the Rust workspace (crates/* + xtask). Portable artifacts
# come straight out of `cargo xtask dist`.
# macOS has no runner on this instance (all jobs run ubuntu-latest) and
# cannot be cross-built from Linux without the Apple SDK — macOS assets
# are pending a macOS runner, they are NOT faked.
#
# No hardcoded instance URL is needed — links use github.server_url, and the
# container registry host is derived from it. Secrets to configure per
# instance (Forgejo AND Gitea):
#   TELEMETRY_ENDPOINT / TELEMETRY_USER / TELEMETRY_API_KEY / TELEMETRY_TENANT,
#   DISCORD_WEBHOOK_URL (single notification per run, see `notify` job).
#
# Windows installer is best-effort (Wine + ISCC); the portable ZIP always
# ships. The Inno script registers the `greg://` protocol and skips the
# VC++ redist for Rust builds (/DSkipVCRedist).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signing:
        description: 'Signing mode (Linux hosts: self-signed via osslsigncode if installed, else unsigned)'
        type: choice
        options:
          - none
          - self-signed
        default: 'none'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      numeric_version: ${{ steps.resolve.outputs.numeric_version }}
      is_release: ${{ steps.resolve.outputs.is_release }}
      is_pre: ${{ steps.resolve.outputs.is_pre }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        shell: bash
        run: |
          # VERSION file is the single source of truth, workspace Cargo.toml is the fallback.
          ver="$(cat VERSION 2>/dev/null | tr -d '\r' | xargs)"
          if [ -z "$ver" ]; then
            ver=$(sed -n 's:^version = "\(.*\)":\1:p' Cargo.toml | head -n 1 | tr -d '\r' | xargs)
          fi
          [ -n "$ver" ] || ver='1.6.1'
          numeric="${ver%%-*}"
          if [[ "$numeric" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            numeric="$numeric.0"
          elif [[ ! "$numeric" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            numeric='1.6.1.0'
          fi
          is_release=false
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9] ]] && is_release=true
          is_pre=false
          [[ "$ver" == *-* || "$GITHUB_REF_NAME" == *-* ]] && is_pre=true
          {
            echo "version=$ver"
            echo "numeric_version=$numeric"
            echo "is_release=$is_release"
            echo "is_pre=$is_pre"
          } >> "$GITHUB_OUTPUT"
          echo "Version=$ver Numeric=$numeric IsRelease=$is_release IsPre=$is_pre"

  parity:
    name: Workflow Parity (.forgejo == .gitea)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail when Forgejo/Gitea workflow copies drift
        shell: bash
        run: |
          if ! diff -r .forgejo/workflows .gitea/workflows; then
            echo "::error::.forgejo/workflows and .gitea/workflows differ — keep both copies byte-identical."
            exit 1
          fi
          echo "Workflow copies in sync."

  test:
    name: Test
    needs: [version, parity]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Slint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build-windows-cross:
    name: Build Windows (cross-compiled on Linux)
    needs: [version, test]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw + zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 zip

      - uses: Swatinem/rust-cache@v2

      - name: Dist Windows x64
        run: cargo run -p xtask -- dist --target x86_64-pc-windows-gnu

      - name: Self-sign (osslsigncode, best-effort)
        if: ${{ inputs.signing == 'self-signed' }}
        run: |
          STAGE="$(ls -d dist/gregmodmanager-*-win-x64 | head -n 1)"
          if command -v osslsigncode >/dev/null 2>&1 && [ -n "${{ secrets.WINDOWS_SIGN_PFX_B64 }}" ]; then
            echo "${{ secrets.WINDOWS_SIGN_PFX_B64 }}" | base64 -d > /tmp/sign.pfx
            # Primary project URL (Forgejo main repo); GitHub archive mirror as fallback.
            info_url="https://git.datacentermods.com/teamGreg/gregModmanager"
            # Fallback: https://github.com/mleem97/gregModmanager
            osslsigncode sign -pkcs12 /tmp/sign.pfx -pass "${{ secrets.WINDOWS_SIGN_PASSWORD }}" \
              -n "gregModmanager" -i "$info_url" \
              -in "$STAGE/gregmodmanager.exe" -out "$STAGE/gregmodmanager-signed.exe"
            mv "$STAGE/gregmodmanager-signed.exe" "$STAGE/gregmodmanager.exe"
            rm -f /tmp/sign.pfx
            # Re-zip (the xtask archive predates signing) + refresh the hash sidecar.
            (cd dist && rm -f ./*.zip ./*.sha256 && zip -r "$(basename "$STAGE").zip" "$(basename "$STAGE")" && sha256sum "$(basename "$STAGE").zip" > "$(basename "$STAGE").zip.sha256")
          else
            echo "::warning::self-signed requested but osslsigncode or WINDOWS_SIGN_PFX_B64 secret missing — shipping unsigned."
          fi

      - name: Inno Setup EXE (Wine, best-effort)
        run: |
          STAGE="$(ls -d dist/gregmodmanager-*-win-x64 | head -n 1)"
          if command -v wine >/dev/null 2>&1 && { command -v iscc >/dev/null 2>&1 || [ -f "$HOME/.wine/drive_c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; }; then
            echo "Attempting Inno Setup build under Wine..."
            ISCC_BIN="$(command -v iscc || echo "$HOME/.wine/drive_c/Program Files (x86)/Inno Setup 6/ISCC.exe")"
            SRC_WIN="$(winepath -w "$PWD/$STAGE")"
            wine "$ISCC_BIN" "build/installer/gregModmanager.iss" \
              "/DAppVersion=${{ needs.version.outputs.version }}" \
              "/DAppNumericVersion=${{ needs.version.outputs.numeric_version }}" \
              "/DSourceDir=${SRC_WIN}" \
              "/DMyAppExeName=gregmodmanager.exe" \
              "/DSkipVCRedist" || echo "::warning::Inno Setup build failed — shipping portable ZIP only."
          else
            echo "::notice::Wine/ISCC not available — skipping installer EXE, shipping portable ZIP only."
          fi
        shell: bash

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: |
            dist/gregmodmanager-*-win-x64.zip
            dist/gregmodmanager-*-win-x64.zip.sha256
            build/installer/Output/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: [version, test]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Slint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Dist Linux x64
        run: cargo run -p xtask -- dist

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: linux-portable
          path: |
            dist/gregmodmanager-*-linux-x64.tar.gz
            dist/gregmodmanager-*-linux-x64.tar.gz.sha256
          if-no-files-found: error

  build-linux-packages:
    name: Build Linux Packages (DEB/RPM)
    needs: [version, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt update
          sudo apt install -y nfpm
          nfpm --version

      - name: Download Linux portable
        uses: actions/download-artifact@v8
        with:
          name: linux-portable
          path: ./artifacts/dl

      - name: Build packages
        run: |
          mkdir -p ./artifacts/stage ./artifacts/packages
          tar -xzf ./artifacts/dl/gregmodmanager-*-linux-x64.tar.gz -C ./artifacts/stage
          chmod +x ./build/scripts/linux/build-rust-packages.sh
          ./build/scripts/linux/build-rust-packages.sh ./artifacts/stage ${{ needs.version.outputs.version }} ${{ needs.version.outputs.is_pre }} ./artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: artifacts/packages/gregmodmanager-*
          if-no-files-found: error

      - name: Build & Push Container (instance registry)
        if: github.event_name != 'pull_request'
        run: |
          # Derive registry host from the instance URL (no hardcoded host).
          REGISTRY_HOST="$(echo "${{ github.server_url }}" | sed -e 's|^https\?://||' -e 's|/.*$||')"
          IMAGE="oci://${REGISTRY_HOST}/${{ github.repository_owner }}/gregmodmanager"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY_HOST" -u ${{ github.actor }} --password-stdin
          docker build -t "$REGISTRY_HOST/${{ github.repository_owner }}/gregmodmanager:${{ needs.version.outputs.version }}" -t "$REGISTRY_HOST/${{ github.repository_owner }}/gregmodmanager:latest" -f - . <<'EOF'
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends fontconfig libfreetype6 && rm -rf /var/lib/apt/lists/*
          WORKDIR /opt/gregmodmanager
          COPY artifacts/stage/ ./
          RUN chmod +x /opt/gregmodmanager/gregmodmanager
          ENTRYPOINT ["/opt/gregmodmanager/gregmodmanager"]
          EOF
          docker push "$REGISTRY_HOST/${{ github.repository_owner }}/gregmodmanager:${{ needs.version.outputs.version }}"
          docker push "$REGISTRY_HOST/${{ github.repository_owner }}/gregmodmanager:latest"

  release:
    name: Release
    needs: [version, build-windows-cross, build-linux, build-linux-packages]
    runs-on: ubuntu-latest
    if: needs.version.outputs.is_release == 'true' && github.event_name != 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows Portable
        uses: actions/download-artifact@v8
        with:
          name: windows-portable
          path: ./dist

      - name: Download Linux Portable
        uses: actions/download-artifact@v8
        with:
          name: linux-portable
          path: ./dist

      - name: Download Linux Packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: ./dist

      - name: Create Forgejo release & upload assets
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          IS_PRE: ${{ needs.version.outputs.is_pre }}
        run: |
          python3 - "$FORGEJO_TOKEN" "${{ github.server_url }}" "${{ github.repository }}" "$TAG_NAME" "$IS_PRE" <<'EOF'
          import json, mimetypes, os, sys, urllib.request

          token, server, repo, tag, is_pre = sys.argv[1:6]
          api = server.rstrip('/') + '/api/v1'
          headers = {'Authorization': f'token {token}', 'Content-Type': 'application/json'}

          def call(method, path, payload=None, raw=None, ctype=None):
              data = raw if raw is not None else (json.dumps(payload).encode() if payload is not None else None)
              h = dict(headers)
              if ctype:
                  h['Content-Type'] = ctype
              req = urllib.request.Request(api + path, data=data, headers=h, method=method)
              with urllib.request.urlopen(req) as res:
                  body = res.read()
                  return json.loads(body) if body and res.headers.get_content_type() == 'application/json' else body

          release = call('POST', f'/repos/{repo}/releases', {
              'tag_name': tag,
              'name': tag,
              'prerelease': is_pre.lower() == 'true',
              'draft': False,
              'body': f'Release {tag} — built by Forgejo/Gitea Actions.',
          })
          rid = release['id']
          print(f"Release id={rid}")

          dist = 'dist'
          for root, _, files in os.walk(dist):
              for name in sorted(files):
                  path = os.path.join(root, name)
                  ctype = mimetypes.guess_type(name)[0] or 'application/octet-stream'
                  with open(path, 'rb') as fh:
                      data = fh.read()
                  req = urllib.request.Request(
                      f'{api}/repos/{repo}/releases/{rid}/assets?name={name}',
                      data=data,
                      headers={'Authorization': f'token {token}', 'Content-Type': ctype},
                      method='POST')
                  with urllib.request.urlopen(req):
                      print(f'Uploaded {name} ({len(data)} bytes)')
          EOF

  notify:
    # Exactly ONE Discord message per completed run (push/dispatch only — PR
    # runs stay silent so the channel is not spammed).
    name: Notify Discord (once)
    needs: [version, test, build-windows-cross, build-linux, build-linux-packages, release]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send single Discord notification
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is empty, skipping notification."
            exit 0
          fi

          if echo "$RESULTS" | grep -q '"result":"failure"'; then
            status="❌ Failed"; color=15158332
          elif echo "$RESULTS" | grep -q '"result":"cancelled"'; then
            status="⚠️ Cancelled"; color=16776960
          else
            status="✅ Success"; color=3066993
          fi

          payload=$(cat <<EOF
          {
            "username": "gregModmanager CI",
            "embeds": [
              {
                "title": "${status}: ${EVENT} ${REF} (${VERSION})",
                "description": "One summary per run — details in the linked run.",
                "url": "${RUN_URL}",
                "color": ${color},
                "fields": [
                  { "name": "Version", "value": "\`${VERSION}\`", "inline": true },
                  { "name": "Event", "value": "\`${EVENT}\`", "inline": true }
                ],
                "footer": { "text": "Build powered by Forgejo/Gitea Actions" },
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ],
            "components": [
              {
                "type": 1,
                "components": [
                  { "type": 2, "style": 5, "label": "View Run", "url": "${RUN_URL}" }
                ]
              }
            ]
          }
          EOF
          )

          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"
