name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      numeric_version: ${{ steps.resolve.outputs.numeric_version }}
      is_release: ${{ steps.resolve.outputs.is_release }}
      is_pre: ${{ steps.resolve.outputs.is_pre }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        run: |
          version="$(tr -d '\r\n ' < VERSION 2>/dev/null || true)"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          fi
          test -n "$version"

          numeric="${version%%-*}"
          if [[ "$numeric" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            numeric="$numeric.0"
          fi

          is_release=false
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9] ]] && is_release=true
          is_pre=false
          [[ "$version" == *-* || "$GITHUB_REF_NAME" == *-* ]] && is_pre=true

          {
            echo "version=$version"
            echo "numeric_version=$numeric"
            echo "is_release=$is_release"
            echo "is_pre=$is_pre"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test Workspace
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build-windows:
    name: Windows Installer and Portable Build
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows portable package
        run: cargo run -p xtask -- dist
      - name: Build Windows installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: build/installer/gregModmanager.iss
          options: >-
            /DMyAppVersion=${{ needs.version.outputs.version }}
            /DMyAppNumericVersion=${{ needs.version.outputs.numeric_version }}
            /DSourceDir=dist/gregmodmanager-${{ needs.version.outputs.version }}-win-x64
            /DMyAppExeName=gregmodmanager.exe
            /DSkipVCRedist
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/gregmodmanager-*-win-x64.zip
            dist/gregmodmanager-*-win-x64.zip.sha256
            build/installer/Output/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux Portable Build
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux portable package
        run: cargo run -p xtask -- dist
      - name: Upload Linux portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: |
            dist/gregmodmanager-*-linux-x64.tar.gz
            dist/gregmodmanager-*-linux-x64.tar.gz.sha256
          if-no-files-found: error

  build-linux-packages:
    name: Linux Distribution Packages
    needs: [version, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' |
            sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nfpm
      - uses: actions/download-artifact@v4
        with:
          name: linux-portable
          path: artifacts/download
      - name: Build Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage artifacts/packages
          tar -xzf artifacts/download/gregmodmanager-*-linux-x64.tar.gz \
            --strip-components=1 \
            -C artifacts/stage
          chmod +x build/scripts/linux/build-rust-packages.sh
          ./build/scripts/linux/build-rust-packages.sh \
            artifacts/stage \
            '${{ needs.version.outputs.version }}' \
            '${{ needs.version.outputs.is_pre }}' \
            artifacts/packages
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: artifacts/packages/*
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.name }} Build
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install macOS build dependencies
        run: brew install pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS portable package
        run: cargo run -p xtask -- dist --target ${{ matrix.target }}
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: |
            dist/gregmodmanager-*-macos-*.tar.gz
            dist/gregmodmanager-*-macos-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, build-windows, build-linux-packages, build-macos]
    if: needs.version.outputs.is_release == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Download Linux portable artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-portable
          path: dist
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: dist
      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          IS_PRE: ${{ needs.version.outputs.is_pre }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$TAG_NAME" dist/* --title "$TAG_NAME" --generate-notes)
          if [ "$IS_PRE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
