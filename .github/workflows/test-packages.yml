name: Build packages and publish stable release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Linux quality checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 scripts/tests/test_publish_github_release.py

  linux:
    name: Linux test packages
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Build portable archive and packages
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          cargo xtask dist
          build/scripts/linux/build-rust-packages.sh "dist/gregmodmanager-${version}-linux-x64" "$version" false dist/packages
          (cd dist && sha256sum -c ./*.sha256)
          (cd dist/packages && sha256sum -c ./*.sha256)
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-packages
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/packages/*.deb
            dist/packages/*.deb.sha256
            dist/packages/*.rpm
            dist/packages/*.rpm.sha256
            dist/packages/*.pkg.tar.zst
            dist/packages/*.pkg.tar.zst.sha256
      - name: Upload experimental Alpine package
        uses: actions/upload-artifact@v4
        with:
          name: alpine-apk-known-not-working
          if-no-files-found: error
          path: |
            dist/packages/*.apk
            dist/packages/*.apk.sha256

  windows:
    name: Windows test packages
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install installer tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc) -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build portable archive and installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          cargo xtask dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/installer/build-windows.ps1 -StageDir "dist/gregmodmanager-$version-win-x64" -Version $version -OutputDir dist
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-packages
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.msi
            dist/*.sha256

  release:
    name: Publish stable GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: stable-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-test-packages
          path: release-input/linux
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-test-packages
          path: release-input/windows
      - name: Publish stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          mkdir release-assets
          cp release-input/linux/*.tar.gz* release-assets/
          cp release-input/linux/packages/*.deb* release-input/linux/packages/*.rpm* release-input/linux/packages/*.pkg.tar.zst* release-assets/
          cp release-input/windows/* release-assets/
          bash scripts/publish-github-release.sh "$version" release-assets
