name: Avalonia Linux Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/GregModmanager.Avalonia/**'
      - 'src/GregModmanager.Core/**'
      - 'build/scripts/linux/**'
      - '.github/workflows/linux-packages.yml'

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  DOTNET_VERSION: '9.0.x'
  AVALONIA_PROJECT: 'src/GregModmanager.Avalonia/GregModmanager.Avalonia.csproj'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_pre: ${{ steps.resolve.outputs.is_pre }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content -LiteralPath $env:AVALONIA_PROJECT
          $ver = ($csproj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = '1.5.0' }
          $isPre = if ($ver -match '-' -or ($env:GITHUB_REF_NAME -ne 'main' -and $env:GITHUB_REF_NAME -ne 'master')) { 'true' } else { 'false' }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_pre=$isPre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build-packages:
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_Linux_x86_64.tar.gz"
          tar -xzf nfpm.tar.gz nfpm
          sudo mv nfpm /usr/local/bin/
          nfpm --version

      - name: Build packages
        run: |
          chmod +x ./build/scripts/linux/build-avalonia-packages.sh
          ./build/scripts/linux/build-avalonia-packages.sh ./artifacts/avalonia-linux ${{ needs.version.outputs.version }} ${{ needs.version.outputs.is_pre }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-detailed
          path: artifacts/avalonia-linux/packages/gregModmanager-*
          if-no-files-found: error

      - name: Attest packages
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: artifacts/avalonia-linux/packages/gregModmanager-*

      - name: Build GHCR container
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gregmodmanager
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t "$IMAGE_NAME:${{ needs.version.outputs.version }}" -t "$IMAGE_NAME:latest" -f - . <<'EOF'
          FROM mcr.microsoft.com/dotnet/runtime-deps:9.0
          WORKDIR /opt/gregmodmanager
          COPY artifacts/avalonia-linux/publish/ ./
          RUN chmod +x /opt/gregmodmanager/GregModmanager
          ENTRYPOINT ["/opt/gregmodmanager/GregModmanager"]
          EOF
          docker push "$IMAGE_NAME:${{ needs.version.outputs.version }}"
          docker push "$IMAGE_NAME:latest"
