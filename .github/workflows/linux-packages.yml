name: Avalonia Linux Packages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "GregModmanager.Avalonia/**"
      - "scripts/linux/**"
      - ".github/workflows/avalonia-linux-packages.yml"

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build Linux packages
        run: |
          chmod +x scripts/linux/build-avalonia-packages.sh scripts/linux/gregmodmanager
          ./scripts/linux/build-avalonia-packages.sh ./artifacts/avalonia-linux 1.1.0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gregmodmanager-avalonia-linux
          path: artifacts/avalonia-linux/packages/*

      - name: Build GHCR container
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/gregmodmanager-avalonia"
          docker build -t "$IMAGE_NAME:latest" -f - . <<'EOF'
          FROM mcr.microsoft.com/dotnet/runtime-deps:9.0
          WORKDIR /opt/gregmodmanager
          COPY artifacts/avalonia-linux/publish/ ./
          ENTRYPOINT ["/opt/gregmodmanager/GregModmanager.Avalonia"]
          EOF

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push GHCR image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/gregmodmanager-avalonia"
          docker push "$IMAGE_NAME:latest"
