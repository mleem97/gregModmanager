name: "🇬🇧 Bug Report"
description: "Report a reproducible bug in the Mod Manager"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue.
        Please provide as much detail as possible so we can reproduce and fix it quickly.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear and concise summary of the problem.
      placeholder: "When I click ..., the app ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "I expected the mod to enable and..."
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Mod Manager version
      placeholder: "e.g. 1.0.2"
    validations:
      required: true

  - type: input
    id: game_version
    attributes:
      label: Game version
      description: Which version of the game are you modding?
      placeholder: "e.g. v1.5.2"

  - type: dropdown
    id: install_type
    attributes:
      label: Installation type
      options:
        - Installer
        - Portable / Local install
        - Built from source
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste logs from Settings -> Logs or drag & drop screenshots here.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues to make sure this hasn't been reported yet.
          required: true
        - label: I included clear reproduction steps.
          required: true
